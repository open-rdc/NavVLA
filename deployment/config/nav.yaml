# つくば用(2026-11-05)。津田沼の設定は nav_tsudanuma.yaml
# 魚眼つくばだけ fisheye_tsukuba_v2_omnivla の epoch 28 (つくばの検証用で psi_mae_turn 最良 0.143)。SSD の weights/navvla/fisheye_tsukuba_v2_omnivla から deployment/weights/ に置く
# 止まる所を完全停止にして学習し直した重み(zero_stop_m)ができたら差し替える
weights_path: deployment/weights/omnivla-edge_fisheye_tsukuba_v2_e28.pth
model_type: omnivla-edge
context_size: 5
len_traj_pred: 8

interval_ms: 200
# 学習の waypoint_spacing と同じ値(fisheye_v1 は 3)。過去画像・予測点とも 0.6 秒おき
context_spacing: 3
# 学習の走行の /cmd_vel は走行中の中央値 1.0 m/s(津田沼 123146。つくばも白線へ近づく所で 1 m/s 前後)。上限もそれに合わせる(navigation.py の clip も 1.0)
linear_max_vel: 1.0
angular_max_vel: 0.5
close_threshold: 1.0

modality_id: 7
# modality flags (pose/image/language) are derived automatically from modality_id
# 0: satellite only
# 1: pose and satellite
# 2: satellite and image
# 3: all
# 4: pose only
# 5: pose and image
# 6: image only
# 7: language only
# 8: language and pose

# Optional inference settings
waypoint_select: 0
# 学習の正規化は metric_waypoint_spacing(0.17) x waypoint_spacing(3) = 0.51 (training/data/dataset.py)
metric_waypoint_spacing: 0.51
goal_pose: [10.0, -1.0, 0.0, -1.0]
goal_image_path: OmniVLA/inference/goal_img.jpg
path_frame_id: base_link

# 止まれ: "stop" を含む指示が出たら /cross (std_msgs/Empty) までその指示を保持する(動くかはモデルが決める。白線で前に詰める)。
# /cross を受けたら、トポマップでその止まれの区間の次の指示(横断歩道を渡る指示など)に切り替え、位置推定が区間を抜けたら地図の指示に戻す。
# 白線の次が横断歩道の止まれのときは、白線と横断歩道で 1 回ずつ押す(2026-11-05 本人)
# トポマップを使わないときは、止まれ以外の指示がこの秒数続いたら戻す
cross_release_sec: 3.0
# /cross から渡る指示を出すのは、動いている時間でこの秒数まで(止まって待っている間は数えない)。推定が止まれの区間を
# 超えないままだと次の止まれを保持できず走り抜けるので、超えたら地図の指示に戻す(まだ止まれの区間ならもう一度止まる)。
# 横断は学習データで長くても十数秒。次の指示も止まれ(白線の次の横断歩道)のときは、ボタンで次の止まれをそのまま保持し、この上限は使わない
cross_max_sec: 20.0
# 予測点(waypoint_select=0, 0.6秒先)までの距離[m]がこれ未満なら止める。0 で無効。3秒先(select=4)で決めた 0.6 を 0.6/3 倍した値
# 検証走行で 0.6m: 通常区間の誤停止 0%、横断歩道の停止区間で 86% 停止(残りは止まる前の減速部分)
# つくばでは下の stop_path_m で止めるので無効。select=0 で 0.12 にすると 0.6 秒先が 0.12 m 未満 = 0.2 m/s 未満で止まり、
# 白線で前のロボットに続いてゆっくり(0.16〜0.18 m/s)進む動きまで止めてしまう
stop_distance: 0.0
# 予測した経路の全点が今の位置からこの距離[m]以内なら止める。0 で無効。0.3 = 4.8 秒で 0.3 m(平均 0.06 m/s)以下のじわじわ進む経路を採用しない
# つくばのオフライン評価(2026-11-05)では止まる場面の予測が 4.8 秒で 0.1〜0.3 m 進んでいた。学習の zero_stop_m(0.3)と同じ値
stop_path_m: 0.3

# 位置推定: feat/toponav のベイズフィルタ(PlaceNet 特徴)。推定したノードの prompt を言語指示にする(pfoe は使わない)
# トポマップ: 1 周を通した周回が無いので 10/03 11_19_56 と full1 を横断歩道でつないだもの(2,430 ノード)。SSD の weights/navvla/topomap/tsukuba_loop_step5_m03 を data/ に置く
# 5 フレームおきで止まっている間は 1 ノードにまとめ，止まれの指示は動き出して 2 m 進むまで延ばした(README.txt)
# ※学習に使った周回から作っている(評価用 15_39_55 は使っていない)
use_toponav: true
topomap_path: data/tsukuba_loop_step5_m03/topomap.yaml
topomap_image_dir: data/tsukuba_loop_step5_m03/images
placenet_weight_path: deployment/weights/placenet.pt
toponav_crop_size: 0        # 魚眼は切り出さない(トポマップ作成時と揃える)
# 遷移窓 [lower, upper): 1周期(0.2秒)で「その場 or 1ノード前進」。[-1,1) だと full2 で追従しなかった(2026-10-16)
toponav_window_lower: 0
toponav_window_upper: 2
toponav_window_radius: 2
toponav_min_score: 0.4      # ピーク±2ノードの確率の和がこれ未満なら指示を変えない
# 観測の尤度の鋭さ(既定 5)。つくばの 1 周の地図で，地図に使っていない周回を流して決めた(2026-11-05，vla-nav-experiments の tune_toponav.py)。
# 道順が地図と同じ 5 周回で 5→12: 3 ノード以内 67→78%，地図の止まれの所で止まったとき止まれが出る 32→36/38。窓 [0,3)・[-1,2) は悪い，min_score はほぼ効かない
toponav_delta: 12.0
